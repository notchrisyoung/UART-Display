; NERD (Networked E-paper Remote Display) - LilyGo T5 4.7" (ESP32-WROVER with PSRAM)
;
;   pio run -t upload        build and flash
;   pio device monitor       serial monitor (115200)
;   pio run -t screentest    interactive screen tester (scripts/screen_test.py)
;   pio run -t screendemo    show every screen once, report pass/fail

[env:t5-47]
platform = espressif32@6.0.1          ; Arduino-ESP32 2.0.6, the core this was developed on
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = post:scripts/pio_targets.py   ; adds the screentest / screendemo tasks
build_flags =
    -DBOARD_HAS_PSRAM                  ; the framebuffer lives in PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#v0.1.0
    bblanchon/ArduinoJson@7.3.1
; JTAG debugging (the old Arduino IDE setup used an ESP-WROVER-KIT style FT2232 adapter):
; debug_tool = esp-prog
